[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mainframe-mcp"
dynamic = ["version"]
description = "GPU-accelerated semantic knowledge base MCP server for Claude Code and other MCP agents. Local embedding, reranking, contradiction detection, and consolidation on a single GPU."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "sushiHex"}]
dependencies = [
    "lancedb>=0.15",
    "sentence-transformers>=5.4.1",
    "transformers>=5.7.0",
    "packaging>=23",
    # The server uses the 1.x low-level Server decorators; 2.x removes list_tools.
    "mcp>=1.0,<2",
    "tantivy>=0.22",
    # Store's projected reads (dedup hash scans, stats) go through
    # table.to_lance() — lancedb does NOT pull pylance in on its own, and
    # without it dedup silently degrades to no-op (empty donor sets).
    "pylance>=0.20",
    # The default Qwen reranker uses NF4; Harrier embedding uses native BF16.
    "bitsandbytes>=0.43",
    # Qwen's quantized loader requires
    # accelerate — it is NOT pulled in transitively on a clean install.
    "accelerate>=0.26",
    # store.search imports pandas at runtime to merge vector+FTS candidates.
    "pandas>=2.0",
    # v2 file watching, process ownership, and local HTTP transport.
    "watchdog>=6.0",
    "filelock>=3.12",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "starlette>=0.40",
]

[project.urls]
Repository = "https://github.com/sushiHex/mainframe-mcp"
Issues = "https://github.com/sushiHex/mainframe-mcp/issues"

[project.scripts]
mainframe-mcp = "mainframe.adapters.mcp_stdio_shim:main"
mainframe = "mainframe.adapters.cli:main"

[project.optional-dependencies]
consolidation = ["llama-cpp-python>=0.3"]
# Opt-in API contextual retrieval at ingest (contextualizer.py).
contextual = ["anthropic>=0.40"]
# GPU-free test tier: fakes + real LanceDB (torch arrives via sentence-transformers).
test = ["pytest>=8.0", "numpy"]
# Optional telemetry and owned-worker integration tests for local model trials.
eval = ["nvidia-ml-py>=12", "psutil>=5.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real filesystem watchers and timing (deselect with -m 'not slow')"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mainframe_mcp.__version__"}
