# GPU-free test suite (fake CPU embedder + real LanceDB) — the per-push gate.
# The GPU eval (eval/evaluate.py --min-score) runs manually/nightly on the 3090,
# not here.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch first (avoid the CUDA wheel bundle)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package + test deps
        run: pip install -e .[test]
      - name: Run suite
        run: python -m pytest tests/ -q

  # Repeat the required pre-push audit after publication. Tests are included.
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit private paths and file types in all reachable commits
        run: python scripts/audit_public_paths.py
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan secrets and personal paths including tests and history
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --ignore-gitleaks-allow
          --max-decode-depth 2 --max-archive-depth 2 --log-opts="--all --full-history" .
